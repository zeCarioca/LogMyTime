<!-- Reset Current Timer Confirmation Pop-up Modal -->
<div id="resetModal" class="modal-overlay" aria-modal="true" role="dialog">
  <div class="modal-card">
    <div class="modal-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
    </div>
    <h3>Reset current timer?</h3>
    <p>Stopping will reset the timer back to 00:00:00. Any unsaved timer progress will be cleared.</p>
    <div class="modal-actions">
      <button type="button" id="cancelResetBtn" class="btn-modal-cancel">Cancel</button>
      <button type="button" id="confirmResetBtn" class="btn-modal-confirm">Reset Timer</button>
    </div>
  </div>
</div>
