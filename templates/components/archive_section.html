<!-- Collapsible Archive Section -->
<div class="archive-section" id="archiveSection">
  <button type="button" class="archive-toggle-btn" id="archiveToggleBtn" aria-expanded="false">
    <div class="archive-toggle-left">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" class="archive-icon">
        <path d="M1.5 2A1.5 1.5 0 0 0 0 3.5v1A1.5 1.5 0 0 0 1.5 6h13A1.5 1.5 0 0 0 16 4.5v-1A1.5 1.5 0 0 0 14.5 2h-13ZM1 3.5a.5.5 0 0 1 .5-.5h13a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-1ZM2 7.5A.5.5 0 0 1 2.5 7h11a.5.5 0 0 1 .5.5v6.25a1.75 1.75 0 0 1-1.75 1.75h-8.5A1.75 1.75 0 0 1 2 13.75V7.5Zm1 0v6.25c0 .414.336.75.75.75h8.5a.75.75 0 0 0 .75-.75V7.5H3ZM6 9.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5Z"/>
      </svg>
      <span class="archive-title">Archive</span>
      <span class="archive-count" id="archiveCount">{{ archived_repositories|length }}</span>
    </div>
    <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" class="archive-chevron" id="archiveChevron">
      <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/>
    </svg>
  </button>

  <div class="archive-content" id="archiveContent" style="display: none;">
    {% if archived_repositories %}
      <div class="archive-list">
        {% for repo in archived_repositories %}
          <div class="archive-item">
            <div class="archive-item-info">
              <strong>{{ repo.full_name }}</strong>
              <span class="archive-branch-tag">{{ repo.default_branch }}</span>
              <span class="archive-unsynced-text">({{ repo.unsynced_minutes }}m pending)</span>
            </div>
            <form action="{{ url_for('repos.toggle_repo_visibility', repo_id=repo.id) }}" method="POST" style="margin: 0;">
              <button type="submit" class="btn-repo-action btn-repo-unhide" title="Restore repository from Archive">
                <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor">
                  <path d="M8 2c1.981 0 3.67.992 4.933 2.078 1.27 1.091 2.187 2.345 2.631 3.022a1.86 1.86 0 0 1 0 1.8c-.444.677-1.362 1.931-2.631 3.022C11.67 13.008 9.981 14 8 14c-1.981 0-3.67-.992-4.933-2.078C1.797 10.831.88 9.577.436 8.9a1.86 1.86 0 0 1 0-1.8c.444-.677 1.362-1.931 2.631-3.022C4.33 2.992 6.019 2 8 2ZM1.679 7.932a.36.36 0 0 0 0 .136c.411.586 1.25 1.724 2.398 2.693C5.178 11.684 6.643 12.5 8 12.5c1.357 0 2.822-.816 3.923-1.739 1.148-.969 1.987-2.107 2.398-2.693a.36.36 0 0 0 0-.136c-.411-.586-1.25-1.724-2.398-2.693C10.822 4.316 9.357 3.5 8 3.5c-1.357 0-2.822.816-3.923 1.739-1.148.969-1.987 2.107-2.398 2.693ZM8 5.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"/>
                </svg>
                Unhide
              </button>
            </form>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <div class="archive-empty">
        <p>No repositories in archive.</p>
      </div>
    {% endif %}
  </div>
</div>
